name: Non-Stop EPG Auto Sync (Every 15 min)

on:
  schedule:
    # Run continuously every 15 minutes non-stop
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger at any time
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'DialogTv/**'
      - 'README.md'

concurrency:
  group: dialogtv-epg-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  epg-sync:
    name: ⚡ Continuous Non-Stop EPG Sync
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🚀 Run Resilient EPG Engine
        env:
          # Secret URL: completely hides the source link from public view
          EPG_SOURCE_URL: ${{ secrets.EPG_SOURCE_URL }}
        run: |
          python3 epg.py

      - name: 💾 Commit & Push EPG Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add DialogTv/
          
          if ! git diff --staged --quiet; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit -m "Auto-update EPG [$TIMESTAMP] [skip ci]"
            
            # Non-stop robust push with rebase retries
            for i in {1..3}; do
              echo "Pushing changes (Attempt $i)..."
              git pull --rebase origin main || true
              git push origin HEAD && break || sleep 3
            done
            echo "✅ EPG updated and pushed successfully."
          else
            echo "ℹ️ No changes in EPG data."
          fi
