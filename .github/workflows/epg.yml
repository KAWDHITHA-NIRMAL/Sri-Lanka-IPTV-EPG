name: EPG Auto Sync (15 min)

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Manual run trigger
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'DialogTv/**'
      - 'README.md'

concurrency:
  group: dialogtv-epg-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  epg-sync:
    name: Sync DialogTv EPG
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚡ Run EPG Processor
        env:
          # Secret URL: completely hides the source link from public view
          EPG_SOURCE_URL: ${{ secrets.EPG_SOURCE_URL }}
        run: |
          python epg.py

      - name: 🚀 Commit & Push Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add DialogTv/
          
          if ! git diff --staged --quiet; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit -m "Auto-update EPG [$TIMESTAMP] [skip ci]"
            git push origin HEAD
            echo "✅ EPG updated and pushed successfully."
          else
            echo "ℹ️ No changes in EPG data."
          fi
